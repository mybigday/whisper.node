name: Release
on:
  push:
    tags: '*'
  workflow_dispatch:
    inputs:
      skip_release_native:
        description: 'Skip the release_native job'
        required: false
        default: false
        type: boolean

jobs:
  release_native:
    if: ${{ !inputs.skip_release_native }}
    uses: ./.github/workflows/build-release.yml
    with:
      publish: YES
    secrets: inherit
  publish:
    permissions:
      contents: write
      pull-requests: read
    needs: release_native
    if: ${{ always() && (needs.release_native.result == 'success' || needs.release_native.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=optional
      # The package ships the vendored whisper.cpp sources as a build from
      # source leaves them: with scripts/whisper.cpp.patch applied (CMake does
      # that when configuring). No native build is needed for the package.
      - name: Apply scripts/whisper.cpp.patch
        run: git apply scripts/whisper.cpp.patch
      - name: Publish to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish-if-need
